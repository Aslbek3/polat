<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14120e">
<title>Hisobot — Ziyo Famliy admin</title>
<link rel="stylesheet" href="../style.css">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon.svg">
</head>
<body class="app-body">
  <div class="app-shell">
    <nav class="bottom-nav" id="bottomNav" aria-label="Admin bo'limlari">
      <div class="nav-group-title">Kunlik ish</div>
      <a href="index.html" data-page="index"><span class="ic" aria-hidden="true">📊</span>Bosh sahifa</a>
      <a href="customer-orders.html" data-page="customer-orders"><span class="ic" aria-hidden="true">🛒</span>Onlayn buyurtmalar</a>
      <a href="reservations.html" data-page="reservations"><span class="ic" aria-hidden="true">📅</span>Bronlar</a>
      <a href="reports.html" data-page="reports" aria-current="page"><span class="ic" aria-hidden="true">📈</span>Hisobot</a>
      <a href="expenses.html" data-page="expenses"><span class="ic" aria-hidden="true">💵</span>Xarajatlar</a>
      <a href="inventory.html" data-page="inventory"><span class="ic" aria-hidden="true">📦</span>Ombor</a>
      <div class="nav-group-title">Sozlash</div>
      <a href="menu.html" data-page="menu"><span class="ic" aria-hidden="true">🍽️</span>Menyu</a>
      <a href="tables.html" data-page="tables"><span class="ic" aria-hidden="true">🪑</span>Stollar</a>
      <a href="waiters.html" data-page="waiters"><span class="ic" aria-hidden="true">👥</span>Xodimlar</a>
      <a href="settings.html" data-page="settings"><span class="ic" aria-hidden="true">⚙️</span>Sozlamalar</a>
    </nav>
    <div class="app-main">
      <div class="topbar">
        <h1>Hisobot</h1>
        <button type="button" class="logout-btn" id="logoutBtn">Chiqish</button>
      </div>
      <main>
        <!-- A-11 (2026-09-10): tayyor davr chiplari (datePresets) sana maydonlari
             ustida; <form> — Enter bilan ham ishlaydi (A-19). -->
        <form class="card" id="filterForm" novalidate>
          <div id="reportPresets"></div>
          <div class="form-grid filter-row">
            <div class="field"><label for="filterFrom">Dan</label><input id="filterFrom" type="date"></div>
            <div class="field"><label for="filterTo">Gacha</label><input id="filterTo" type="date"></div>
            <!-- Holat filtri (2026-09-10): server GET /admin/reports/orders endi
                 'closed'dan tashqari 'open' va 'cancelled'ni ham qo'llab-quvvatlaydi,
                 frontendda esa 'closed' QATTIQ yozib qo'yilgan edi — admin bekor
                 qilingan stol buyurtmalarini umuman ko'ra olmasdi. -->
            <div class="field">
              <label for="filterStatus">Holat</label>
              <select id="filterStatus">
                <option value="closed">Yopilgan (sotuvlar)</option>
                <option value="">Hammasi</option>
                <option value="open">Ochiq stollar</option>
                <option value="cancelled">Bekor qilingan</option>
              </select>
            </div>
            <button type="submit" class="btn primary" id="filterBtn">Ko'rsatish</button>
          </div>
        </form>

        <!-- A-01 / A-28 (2026-09-10): plitkalar hisob tartibida, tepada davr nomi
             (eski raqam yangi davrniki deb o'qilmasin — A-11, A-24). -->
        <h2 class="card-title" id="periodTitle">Bugun</h2>
        <div class="stat-grid mt-8" id="reportTiles">
          <div class="stat-tile"><div class="label">Tushum</div><div class="value" id="statRevenue">—</div></div>
          <div class="stat-tile muted"><div class="label">Taom tan narxi</div><div class="value" id="statCogs">—</div></div>
          <div class="stat-tile"><div class="label">Xarajatlar</div><div class="value" id="statExpenses">—</div></div>
          <div class="stat-tile"><div class="label" id="statNetLabel">Sof foyda</div><div class="value" id="statNet">—</div></div>
        </div>
        <div class="stat-grid mt-8">
          <div class="stat-tile"><div class="label">Sotuvlar soni</div><div class="value" id="statOrders">—</div></div>
          <div class="stat-tile"><div class="label">O'rtacha chek</div><div class="value" id="statAvg">—</div></div>
        </div>

        <h2 class="card-title mt-16" id="orderListTitle">Sotuvlar</h2>
        <p class="card-sub hidden" id="orderListNote" role="status"></p>
        <div id="orderList" class="mt-8"><p class="dim">Yuklanmoqda...</p></div>
      </main>
    </div>
  </div>
  <script src="../app.js" data-api-base="../"></script>
  <script src="admin.js"></script>
  <script src="reports.js"></script>
</body>
</html>
