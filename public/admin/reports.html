<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hisobot — Ziyo Famliy admin</title>
<link rel="stylesheet" href="../style.css">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon.svg">
</head>
<body class="app-body">
  <div class="app-shell">
    <nav class="bottom-nav" id="bottomNav">
      <a href="index.html" data-page="index"><span class="ic">📊</span>Bosh sahifa</a>
      <a href="menu.html" data-page="menu"><span class="ic">🍽️</span>Menyu</a>
      <a href="tables.html" data-page="tables"><span class="ic">🪑</span>Stollar</a>
      <a href="waiters.html" data-page="waiters"><span class="ic">👥</span>Xodimlar</a>
      <a href="expenses.html" data-page="expenses"><span class="ic">💵</span>Xarajat</a>
      <a href="reservations.html" data-page="reservations"><span class="ic">📅</span>Bronlar</a>
      <a href="customer-orders.html" data-page="customer-orders"><span class="ic">🛒</span>Buyurtmalar</a>
      <a href="inventory.html" data-page="inventory"><span class="ic">📦</span>Ombor</a>
      <a href="reports.html" data-page="reports"><span class="ic">📈</span>Hisobot</a>
    </nav>
    <div style="flex:1;">
      <div class="topbar">
        <h1>Hisobot</h1>
        <button class="logout-btn" id="logoutBtn">Chiqish</button>
      </div>
      <main>
        <div class="card">
          <div class="form-grid" style="flex-direction:row; gap:8px; align-items:flex-end;">
            <div class="field"><label>Dan</label><input id="filterFrom" type="date"></div>
            <div class="field"><label>Gacha</label><input id="filterTo" type="date"></div>
            <!-- Holat filtri (2026-09-10): server GET /admin/reports/orders endi
                 'closed'dan tashqari 'open' va 'cancelled'ni ham qo'llab-quvvatlaydi,
                 frontendda esa 'closed' QATTIQ yozib qo'yilgan edi — admin bekor
                 qilingan stol buyurtmalarini umuman ko'ra olmasdi. -->
            <div class="field">
              <label>Holat</label>
              <select id="filterStatus">
                <option value="closed">Yopilgan</option>
                <option value="">Hammasi</option>
                <option value="open">Ochiq</option>
                <option value="cancelled">Bekor qilingan</option>
              </select>
            </div>
            <button class="btn primary" id="filterBtn">Ko'rsatish</button>
          </div>
        </div>

        <div class="stat-grid">
          <div class="stat-tile"><div class="label">Tushum</div><div class="value" id="statRevenue">—</div></div>
          <div class="stat-tile"><div class="label">Xarajat</div><div class="value" id="statExpenses">—</div></div>
          <div class="stat-tile"><div class="label">Sof foyda</div><div class="value" id="statNet">—</div></div>
          <div class="stat-tile"><div class="label">Yopilgan buyurtma</div><div class="value" id="statOrders">—</div></div>
        </div>

        <div class="card-title mt-16" id="orderListTitle">Yopilgan buyurtmalar</div>
        <div id="orderList" class="mt-8"><p class="dim">Yuklanmoqda...</p></div>
      </main>
    </div>
  </div>
  <script src="../app.js" data-api-base="../"></script>
  <script src="reports.js"></script>
</body>
</html>
