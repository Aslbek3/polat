    <div class="app-main">
      <div class="topbar">
        <h1>Stollar</h1>
        <button type="button" class="logout-btn" id="logoutBtn">Chiqish</button>
      </div>
      <main>
        <button type="button" class="btn primary block" id="addBtn">+ Yangi stol</button>
        <div id="tableList" class="mt-16"><p class="dim">Yuklanmoqda...</p></div>
      </main>
    </div>

  <!-- A-19/A-20 (2026-09-10): .modal — <form>: Enter saqlaydi; openFormDialog(). -->
  <div class="modal-backdrop hidden" id="modal">
    <form class="modal" id="tableForm" novalidate>
      <h2 id="modalTitle">Yangi stol</h2>
      <div class="form-grid">
        <div class="field"><label for="fName">Nomi</label><input id="fName" placeholder="masalan: 1-stol" required></div>
        <div class="field"><label for="fSort">Tartib raqami</label><input id="fSort" type="number" value="0" step="1"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="cancelBtn">Bekor</button>
        <button type="submit" class="btn primary" id="saveBtn">Saqlash</button>
      </div>
    </form>
  </div>

  <script src="../app.js" data-api-base="../"></script>
  <script src="admin.js"></script>
  <script src="tables.js"></script>
