<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Xarajatlar — Po'lat admin</title>
<link rel="stylesheet" href="../style.css">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon.svg">
</head>
<body class="app-body">
  <div class="app-shell">
    <nav class="bottom-nav" id="bottomNav">
      <a href="index.html" data-page="index"><span class="ic">📊</span>Bosh sahifa</a>
      <a href="menu.html" data-page="menu"><span class="ic">🍽️</span>Menyu</a>
      <a href="tables.html" data-page="tables"><span class="ic">🪑</span>Stollar</a>
      <a href="waiters.html" data-page="waiters"><span class="ic">👥</span>Xodimlar</a>
      <a href="expenses.html" data-page="expenses"><span class="ic">💵</span>Xarajat</a>
      <a href="reservations.html" data-page="reservations"><span class="ic">📅</span>Bronlar</a>
      <a href="customer-orders.html" data-page="customer-orders"><span class="ic">🛒</span>Buyurtmalar</a>
      <a href="reports.html" data-page="reports"><span class="ic">📈</span>Hisobot</a>
    </nav>
    <div style="flex:1;">
      <div class="topbar">
        <h1>Xarajatlar</h1>
        <button class="logout-btn" id="logoutBtn">Chiqish</button>
      </div>
      <main>
        <div class="card">
          <div class="form-grid">
            <div class="field"><label>Sana</label><input id="fDate" type="date"></div>
            <div class="field"><label>Summasi (so'm)</label><input id="fAmount" type="number"></div>
            <div class="field"><label>Turkumi (ixtiyoriy)</label><input id="fCategory" placeholder="masalan: mahsulot, kommunal"></div>
            <div class="field"><label>Izoh</label><input id="fNote"></div>
            <button class="btn primary block" id="addBtn">+ Xarajat qo'shish</button>
          </div>
        </div>

        <div class="card">
          <div class="form-grid" style="flex-direction:row; gap:8px; align-items:flex-end;">
            <div class="field"><label>Dan</label><input id="filterFrom" type="date"></div>
            <div class="field"><label>Gacha</label><input id="filterTo" type="date"></div>
            <button class="btn" id="filterBtn">Filtrlash</button>
          </div>
        </div>

        <div id="expenseList"><p class="dim">Yuklanmoqda...</p></div>
      </main>
    </div>
  </div>
  <script src="../app.js" data-api-base="../"></script>
  <script src="expenses.js"></script>
</body>
</html>
