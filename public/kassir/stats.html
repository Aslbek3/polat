<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<!-- D-H1 (2026-09-10): maximum-scale=1 olib tashlandi — pinch-zoom bloklangan edi
     (WCAG 1.4.4); iOS avtozoom esa style.css'dagi input{font-size:16px} bilan hal
     qilingan. viewport-fit=cover — D-F8 safe-area (env()) nolga teng bo'lmasin. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14120e">
<title>Statistika — Kassa — Ziyo Famliy</title>
<link rel="stylesheet" href="../style.css">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon.svg">
</head>
<body class="app-body">
  <div class="app-shell">
    <nav class="bottom-nav" id="bottomNav">
      <a href="tables.html" data-page="tables"><span class="ic">🪑</span>Stollar</a>
      <a href="stats.html" data-page="stats"><span class="ic">📈</span>Statistika</a>
      <a href="manual.html" data-page="manual"><span class="ic">🧮</span>Hisoblash</a>
    </nav>
    <div style="flex:1;">
      <div class="topbar">
        <h1>Statistika</h1>
        <button class="logout-btn" id="logoutBtn">Chiqish</button>
      </div>
      <main>
        <div class="card">
          <!-- 2026-09-10: tayyor davrlar (Bugun/Kecha/7 kun/Bu oy/O'tgan oy) —
               stats.js datePresets() shu yerga chiplarni qo'yadi. -->
          <div id="billPresets"></div>
          <!-- D-H2 (2026-09-10): yorliqlar `for` bilan inputga bog'landi.
               flex-wrap (2026-09-10): ikki sana maydoni + "Filtrlash" 390px'da
               ~450px talab qilib butun sahifani gorizontal siljitardi — endi
               sig'maganda tugma keyingi qatorga o'tadi. -->
          <div class="form-grid filter-row">
            <div class="field"><label for="filterFrom">Dan</label><input id="filterFrom" type="date"></div>
            <div class="field"><label for="filterTo">Gacha</label><input id="filterTo" type="date"></div>
            <button type="button" class="btn" id="filterBtn">Filtrlash</button>
          </div>
        </div>

        <div class="stat-grid">
          <div class="stat-tile"><div class="label">Yopilgan hisoblar</div><div class="value" id="statCount">—</div></div>
          <div class="stat-tile"><div class="label">Jami summa</div><div class="value" id="statTotal">—</div></div>
        </div>

        <div class="card-title mt-16">Ro'yxat</div>
        <!-- Ro'yxat serverda 300 ta bilan cheklangan — oshsa shu yerda aytiladi. -->
        <p id="billLimitNote" class="dim mt-8 hidden" role="status"></p>
        <div id="billList" class="mt-8"><p class="dim">Yuklanmoqda...</p></div>
      </main>
    </div>
  </div>
  <script src="../app.js" data-api-base="../"></script>
  <script src="stats.js"></script>
</body>
</html>
