<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<!-- D-H1 (2026-09-10): maximum-scale=1 olib tashlandi — pinch-zoom bloklangan edi
     (WCAG 1.4.4); iOS avtozoom esa style.css'dagi input{font-size:16px} bilan hal
     qilingan. viewport-fit=cover — D-F8 safe-area (env()) nolga teng bo'lmasin. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hisoblash — Kassa — Ziyo Famliy</title>
<link rel="stylesheet" href="../style.css">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon.svg">
</head>
<body class="app-body">
  <div class="app-shell">
    <nav class="bottom-nav" id="bottomNav">
      <a href="tables.html" data-page="tables"><span class="ic">🪑</span>Stollar</a>
      <a href="stats.html" data-page="stats"><span class="ic">📈</span>Statistika</a>
      <a href="manual.html" data-page="manual"><span class="ic">🧮</span>Hisoblash</a>
    </nav>
    <div style="flex:1;">
      <div class="topbar">
        <h1>Qo'lda hisoblash</h1>
        <button class="logout-btn" id="logoutBtn">Chiqish</button>
      </div>
      <main>
        <div class="card">
          <div class="card-title mt-8">Taomlar</div>
          <div id="itemRows"></div>
          <div class="form-grid" style="flex-direction:row; gap:8px;">
            <button class="btn mt-8" type="button" id="menuBtn" style="flex:1;">📋 Menyu</button>
            <button class="btn mt-8" type="button" id="addRowBtn" style="flex:1;">+ Qator qo'shish</button>
          </div>
        </div>
      </main>

      <!-- D-A2 / D-B1 (2026-09-10): inline #c0392b va oltin panel ustida oltin
           matn (2.42:1) edi — endi .btn.danger-solid / .btn.light (tokenlar).
           X-20: 480px'dan tor ekranda style.css "Jami"ni alohida qatorga,
           ikki tugmani ikkinchi qatorga teng bo'lib chiqaradi. -->
      <div class="order-total-bar">
        <span>Jami: <span class="amount" id="totalAmount">0 so'm</span></span>
        <button type="button" class="btn danger-solid" id="clearBtn">Tozalash</button>
        <button type="button" class="btn light" id="createBtn">💳 Chek chiqarish</button>
      </div>
    </div>
  </div>
  <script src="../app.js" data-api-base="../"></script>
  <script src="manual.js"></script>
</body>
</html>
