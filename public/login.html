<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ziyo Famliy — kirish</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
</head>
<body class="login-body">
  <div class="login-wrap">
    <form class="login-card" id="loginForm">
      <div class="login-boot">
        <div class="login-mark">P</div>
        <p><strong>Ziyo Famliy</strong> restorani</p>
        <p class="dim">Tizimga kirish uchun login va parolingizni kiriting</p>
      </div>
      <div class="login-label">Login</div>
      <input type="text" id="username" autocomplete="username" required autofocus>
      <div class="login-label">Parol</div>
      <input type="password" id="password" autocomplete="current-password" required>
      <div class="error-msg" id="errorMsg"></div>
      <button type="submit">Kirish</button>
    </form>
  </div>
  <script src="app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('errorMsg');
      const submitBtn = e.target.querySelector('button');
      errorEl.textContent = '';
      // Ikki marta bosishdan himoya — `scrypt` sinxron, ikkinchi so'rov
      // serverni bekorga bloklaydi va rate-limit hisoblagichini ham oshiradi.
      if (submitBtn) submitBtn.disabled = true;
      try {
        // `noAuthRedirect` SHART: aks holda noto'g'ri parol (401) shu
        // sahifaning O'ZINI qayta yuklab yuboradi va xato xabari ekranda
        // ko'rinishga ulgurmaydi (2026-09-10, public/app.js api() izohiga
        // qarang — bu xodimni sababini bilmagan holda 15 daqiqaga
        // qulflanishiga olib kelardi).
        const data = await api('/login', {
          method: 'POST',
          body: { username, password },
          noAuthRedirect: true,
        });
        if (data.role === 'admin') {
          window.location.href = 'admin/index.html';
        } else if (data.role === 'chef') {
          window.location.href = 'chef/kitchen.html';
        } else if (data.role === 'courier') {
          window.location.href = 'courier/orders.html';
        } else if (data.role === 'kassir') {
          window.location.href = 'kassir/tables.html';
        } else {
          window.location.href = 'waiter/tables.html';
        }
      } catch (err) {
        errorEl.textContent = err.message || "Kirishda xatolik";
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
