<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Po'lat — kirish</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
</head>
<body class="login-body">
  <div class="login-wrap">
    <form class="login-card" id="loginForm">
      <div class="login-boot">
        <div class="login-mark">P</div>
        <p><strong>Po'lat</strong> restorani</p>
        <p class="dim">Tizimga kirish uchun login va parolingizni kiriting</p>
      </div>
      <div class="login-label">Login</div>
      <input type="text" id="username" autocomplete="username" required autofocus>
      <div class="login-label">Parol</div>
      <input type="password" id="password" autocomplete="current-password" required>
      <div class="error-msg" id="errorMsg"></div>
      <button type="submit">Kirish</button>
    </form>
  </div>
  <script src="app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('errorMsg');
      errorEl.textContent = '';
      try {
        const data = await api('/login', { method: 'POST', body: { username, password } });
        if (data.role === 'admin') {
          window.location.href = 'admin/index.html';
        } else if (data.role === 'chef') {
          window.location.href = 'chef/kitchen.html';
        } else {
          window.location.href = 'waiter/tables.html';
        }
      } catch (err) {
        errorEl.textContent = err.message || "Kirishda xatolik";
      }
    });
  </script>
</body>
</html>
